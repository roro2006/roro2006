    <circle cx="1060" cy="54" r="4"/><circle cx="1078" cy="186" r="4"/>
  </g>
  <g transform="translate(965 120)" fill="none" stroke="#a9c1b2" stroke-opacity=".62">
    <circle r="72" stroke-width="1"/><circle r="52" stroke-width="3"/><circle r="18" stroke-width="1"/>
    <path d="M-88 0H88M0-88V88M-62-62L62 62M62-62L-62 62" stroke-width="1"/>
