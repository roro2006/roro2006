<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" role="img" aria-labelledby="title desc">
  <title id="title">All will be Rohan</title>
  <desc id="desc">A dark metallic banner with copper circuitry and black oil accents.</desc>
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080b0e"/>
      <stop offset="0.48" stop-color="#20292d"/>
      <stop offset="1" stop-color="#090c0e"/>
    </linearGradient>
    <linearGradient id="copper" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8c4d2d"/>
      <stop offset="0.5" stop-color="#e08b51"/>
      <stop offset="1" stop-color="#5d2c20"/>
    </linearGradient>
    <radialGradient id="oil" cx="50%" cy="50%" r="50%">
