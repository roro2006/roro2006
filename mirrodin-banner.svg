  <ellipse cx="964" cy="110" rx="310" ry="190" fill="url(#oil)"/>
  <g fill="none" stroke="url(#copper)" stroke-width="2" opacity=".86">
    <path d="M0 42H190L226 78H350"/>
    <path d="M0 188H150L182 156H294"/>
